# Topic 12: CI. When this project is its own GitHub repo, every push runs all tests
# on a GitHub server in headless Chrome and keeps the reports.
name: Selenium tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B test -Dheadless=true -Dslow=0
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            screenshots
